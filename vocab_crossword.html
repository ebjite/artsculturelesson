<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Gaze Vocabulary Crossword</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Georgia',serif;background:linear-gradient(150deg,#5C1A3A 0%,#7B2D52 60%,#5C1A3A 100%);min-height:100vh;color:#F5EAE0;padding:16px;}
h1{text-align:center;font-size:1.7rem;color:#C9963A;letter-spacing:2px;margin-bottom:4px;}
.sub{text-align:center;font-size:0.9rem;color:#E8C5A0;font-style:italic;margin-bottom:20px;}
.grid-wrap{overflow-x:auto;display:flex;justify-content:center;margin-bottom:24px;}
table{border-collapse:collapse;}
td{width:36px;height:36px;border:none;position:relative;}
td.active{border:1.5px solid rgba(201,150,58,0.5);}
td.black{background:#3A1020;}
td.active{background:rgba(245,234,224,0.12);}
td.active.highlighted{background:rgba(201,150,58,0.25);}
td.active.correct{background:rgba(92,184,92,0.3);}
td input{position:absolute;inset:0;width:100%;height:100%;background:transparent;border:none;text-align:center;font-size:1.1rem;font-family:'Georgia',serif;color:#F5EAE0;text-transform:uppercase;outline:none;cursor:pointer;caret-color:transparent;}
td input::selection{background:transparent;}
.num{position:absolute;top:1px;left:2px;font-size:0.55rem;color:#C9963A;line-height:1;pointer-events:none;font-family:'Calibri',sans-serif;font-weight:bold;}
.clues{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:700px;margin:0 auto 20px;}
@media(max-width:500px){.clues{grid-template-columns:1fr;}}
.clue-section h2{font-size:1rem;color:#C9963A;letter-spacing:3px;margin-bottom:10px;text-transform:uppercase;}
.clue{background:rgba(245,234,224,0.08);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:background 0.2s;border:1px solid transparent;}
.clue:hover,.clue.active{background:rgba(201,150,58,0.2);border-color:rgba(201,150,58,0.4);}
.clue.solved{opacity:0.5;}
.clue-num{font-size:0.78rem;font-weight:bold;color:#C9963A;margin-bottom:2px;}
.clue-text{font-size:0.88rem;color:#F5EAE0;line-height:1.4;}
.controls{display:flex;gap:10px;justify-content:center;margin-bottom:20px;flex-wrap:wrap;}
.btn{padding:10px 22px;border-radius:24px;border:none;font-family:'Georgia',serif;font-size:0.9rem;cursor:pointer;letter-spacing:1px;transition:all 0.2s;}
.btn-check{background:linear-gradient(135deg,#C9963A,#7B2D52);color:#fff;}
.btn-check:hover{opacity:0.9;}
.btn-reveal{background:transparent;border:1.5px solid rgba(201,150,58,0.5);color:#C9963A;}
.btn-reveal:hover{background:rgba(201,150,58,0.15);}
.msg{text-align:center;font-size:1rem;min-height:1.4rem;color:#C9963A;margin-bottom:10px;font-style:italic;}
footer{text-align:center;font-size:0.78rem;color:rgba(232,197,160,0.4);margin-top:20px;font-style:italic;}
</style>
</head>
<body>
<h1>THE GAZE</h1>
<p class="sub">Vocabulary Crossword &nbsp;&middot;&nbsp; HUMN 110</p>

<div class="grid-wrap">
<table id="grid"></table>
</div>

<p class="msg" id="msg"></p>

<div class="controls">
  <button class="btn btn-check" onclick="checkAll()">Check Answers</button>
  <button class="btn btn-reveal" onclick="revealAll()">Reveal All</button>
</div>

<div class="clues">
  <div>
    <h2>Across</h2>
    <div id="across-clues"></div>
  </div>
  <div>
    <h2>Down</h2>
    <div id="down-clues"></div>
  </div>
</div>

<footer>HUMN 110 &mdash; Feminism and The Gaze</footer>

<script>
// Grid: 11 rows x 11 cols. '.' = black, letter = part of word
// Words:
// ACROSS:
//  1. GAZE (row0, col0, len4)
//  4. OBJECT (row2, col0, len6)
//  6. STEREOTYPE (row4, col0, len10)
//  8. RESIST (row6, col0, len6)
//  10. VOYEUR (row8, col0, len6)
//  11. SUBJECT (row10, col0, len7)
// DOWN:
//  1. GENDER (col0, row0, len6)
//  2. ZEAL ... no - let's do real words
//  3. POWER (col3, row0, len5)
//  5. OBJECT .. reuse.. 
// Let me lay this out manually with a clean crossword

// Crossword layout (10 cols x 11 rows):
// Words:
// ACROSS:
//  1A: GAZE        row0 col0 →
//  3A: OBJECT      row2 col1 →
//  5A: STEREOTYPE  row4 col0 →
//  7A: RESIST      row6 col2 →
//  9A: PATRIARCHY  row8 col0 →
//  10A: LOOK       row10 col0 →
// DOWN:
//  1D: GAZE... no
//  2D: POWER       col3 row0 ↓
//  4D: BODY        col5 row2 ↓
//  6D: SUBJECT     col0 row4 ↓ (S,U,B,J,E,C,T)
//  8D: MALE        col7 row6 ↓

// Simpler approach: manually define the full grid
const ROWS=11, COLS=11;
// '.' = black, ' ' = placeholder for letter, letter = given letter
// I'll define words and compute the grid

const words=[
  // {word, row, col, dir} dir: 'A'=across, 'D'=down
  {word:'GAZE',        row:0,  col:0, dir:'A', num:1, clue:'The power relationship built into looking'},
  {word:'GENDER',      row:0,  col:3, dir:'D', num:2, clue:'Social construction of male and female roles'},
  {word:'OBJECT',      row:2,  col:1, dir:'A', num:3, clue:'The one who is looked at (subject / ___)'},
  {word:'POWER',       row:0,  col:7, dir:'D', num:4, clue:'What the gaze gives to the one who looks'},
  {word:'STEREOTYPE',  row:4,  col:0, dir:'A', num:5, clue:'A fixed, oversimplified image of a group'},
  {word:'BODY',        row:2,  col:9, dir:'D', num:6, clue:'The medium Frida Kahlo used as her artwork'},
  {word:'RESIST',      row:6,  col:2, dir:'A', num:7, clue:'To refuse or challenge the expected role'},
  {word:'MULVEY',      row:4,  col:5, dir:'D', num:8, clue:'Feminist theorist who coined the male gaze'},
  {word:'PATRIARCHY',  row:8,  col:0, dir:'A', num:9, clue:'A system in which men hold most social power'},
  {word:'LOOK',        row:10, col:0, dir:'A', num:10, clue:'What the gaze requires someone to do'},
  {word:'SUBJECT',     row:4,  col:0, dir:'D', num:11, clue:'The one who has the power to look'},
  {word:'MALE',        row:6,  col:7, dir:'D', num:12, clue:'Type of gaze identified by Mulvey'},
];

// Build grid
const grid=Array.from({length:ROWS},()=>Array(COLS).fill('.'));
const answers=Array.from({length:ROWS},()=>Array(COLS).fill('.'));

words.forEach(w=>{
  for(let i=0;i<w.word.length;i++){
    const r=w.dir==='A'?w.row:w.row+i;
    const c=w.dir==='A'?w.col+i:w.col;
    if(r<ROWS&&c<COLS){
      grid[r][c]=' ';
      answers[r][c]=w.word[i];
    }
  }
});

// Assign clue numbers to cells
const cellNums=Array.from({length:ROWS},()=>Array(COLS).fill(0));
words.forEach(w=>{cellNums[w.row][w.col]=w.num;});

// Render grid
const tbl=document.getElementById('grid');
const inputs=[];
for(let r=0;r<ROWS;r++){
  const tr=document.createElement('tr');
  inputs.push([]);
  for(let c=0;c<COLS;c++){
    const td=document.createElement('td');
    if(grid[r][c]==='.'){
      td.className='black';
      inputs[r].push(null);
    } else {
      td.className='active';
      if(cellNums[r][c]){
        const num=document.createElement('span');
        num.className='num';
        num.textContent=cellNums[r][c];
        td.appendChild(num);
      }
      const inp=document.createElement('input');
      inp.maxLength=1;
      inp.dataset.row=r;
      inp.dataset.col=c;
      inp.addEventListener('input',e=>{
        const v=e.target.value.replace(/[^a-zA-Z]/g,'').toUpperCase();
        e.target.value=v;
        if(v) moveNext(r,c);
        clearMsg();
      });
      inp.addEventListener('keydown',e=>{
        if(e.key==='Backspace'&&!e.target.value) movePrev(r,c);
        if(e.key==='ArrowRight') focusCell(r,c+1);
        if(e.key==='ArrowLeft') focusCell(r,c-1);
        if(e.key==='ArrowDown') focusCell(r+1,c);
        if(e.key==='ArrowUp') focusCell(r-1,c);
      });
      inp.addEventListener('click',()=>highlightWord(r,c));
      td.appendChild(inp);
      inputs[r].push(inp);
    }
    tr.appendChild(td);
  }
  tbl.appendChild(tr);
}

let currentDir='A', currentWord=null;

function focusCell(r,c){
  if(r>=0&&r<ROWS&&c>=0&&c<COLS&&inputs[r][c]){
    inputs[r][c].focus();
  }
}

function moveNext(r,c){
  if(currentDir==='A') focusCell(r,c+1);
  else focusCell(r+1,c);
}
function movePrev(r,c){
  if(currentDir==='A') focusCell(r,c-1);
  else focusCell(r-1,c);
}

function highlightWord(r,c){
  // clear all
  document.querySelectorAll('td.highlighted').forEach(t=>t.classList.remove('highlighted'));
  // find which word this cell belongs to, toggle dir
  const aWord=words.find(w=>w.dir==='A'&&w.row===r&&c>=w.col&&c<w.col+w.word.length);
  const dWord=words.find(w=>w.dir==='D'&&w.col===c&&r>=w.row&&r<w.row+w.word.length);
  let chosen=null;
  if(aWord&&dWord){
    chosen=(currentDir==='A'&&currentWord===aWord)?dWord:aWord;
  } else {
    chosen=aWord||dWord;
  }
  if(chosen){
    currentDir=chosen.dir;
    currentWord=chosen;
    for(let i=0;i<chosen.word.length;i++){
      const cr=chosen.dir==='A'?chosen.row:chosen.row+i;
      const cc=chosen.dir==='A'?chosen.col+i:chosen.col;
      const td=tbl.rows[cr].cells[cc];
      td.classList.add('highlighted');
    }
    // highlight clue
    document.querySelectorAll('.clue').forEach(cl=>cl.classList.remove('active'));
    const clueEl=document.getElementById(`clue-${chosen.dir}-${chosen.num}`);
    if(clueEl){clueEl.classList.add('active');clueEl.scrollIntoView({behavior:'smooth',block:'nearest'});}
  }
}

// Render clues
const acrossDiv=document.getElementById('across-clues');
const downDiv=document.getElementById('down-clues');
[...words].sort((a,b)=>a.num-b.num).forEach(w=>{
  const div=document.createElement('div');
  div.className='clue';
  div.id=`clue-${w.dir}-${w.num}`;
  div.innerHTML=`<div class="clue-num">${w.num} ${w.dir==='A'?'Across':'Down'}</div><div class="clue-text">${w.clue}</div>`;
  div.addEventListener('click',()=>{
    currentDir=w.dir;currentWord=w;
    focusCell(w.row,w.col);
    highlightWord(w.row,w.col);
  });
  if(w.dir==='A') acrossDiv.appendChild(div);
  else downDiv.appendChild(div);
});

function clearMsg(){document.getElementById('msg').textContent='';}

function checkAll(){
  let correct=0,total=0,wrong=0;
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      if(answers[r][c]!=='.'){
        total++;
        const inp=inputs[r][c];
        const val=(inp.value||'').toUpperCase();
        const td=tbl.rows[r].cells[c];
        if(val===answers[r][c]){correct++;td.classList.add('correct');}
        else if(val){wrong++;td.style.color='#E87070';}
      }
    }
  }
  if(correct===total) document.getElementById('msg').textContent='Perfect! All correct!';
  else document.getElementById('msg').textContent=`${correct} / ${total} correct. Keep going!`;
  // mark solved clues
  words.forEach(w=>{
    const allRight=w.word.split('').every((lt,i)=>{
      const r=w.dir==='A'?w.row:w.row+i;
      const c=w.dir==='A'?w.col+i:w.col;
      return (inputs[r][c].value||'').toUpperCase()===lt;
    });
    if(allRight) document.getElementById(`clue-${w.dir}-${w.num}`)?.classList.add('solved');
  });
}

function revealAll(){
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      if(answers[r][c]!=='.'&&inputs[r][c]){
        inputs[r][c].value=answers[r][c];
        inputs[r][c].style.color='#C9963A';
        tbl.rows[r].cells[c].classList.add('correct');
      }
    }
  }
  document.getElementById('msg').textContent='Answers revealed. Study the words!';
}
</script>
</body>
</html>
