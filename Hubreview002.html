<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semester Review Treasure Hunt — Class 002</title>
<style>
  :root {
    --emerald: #0B3D2E;
    --deepteal: #145C45;
    --gold: #D4AF37;
    --cream: #F4F1E6;
    --charcoal: #16241E;
    --danger: #C0392B;
    --dim: #4a5c54;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Calibri", Arial, sans-serif;
    background: linear-gradient(135deg, #0B3D2E 0%, #06212A 100%);
    color: var(--cream);
    min-height: 100vh;
    padding-bottom: 70px;
  }
  header { padding: 22px 20px 10px; text-align: center; }
  header .kicker { letter-spacing: 3px; font-size: 12px; color: var(--gold); font-weight: 700; text-transform: uppercase; }
  header h1 { font-family: Cambria, Georgia, serif; font-size: 26px; margin: 6px 0 2px; }
  header p { color: #9FB8AE; font-size: 13px; margin: 0; }

  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 40px; }

  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .card.light { background: #FFFFFF; color: var(--charcoal); }

  h2.screen-title { font-family: Cambria, Georgia, serif; font-size: 22px; margin: 0 0 12px; }
  .muted { color: #9FB8AE; font-size: 13px; }
  .card.light .muted { color: #6f7a75; }

  #groupGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 14px; }
  @media (min-width: 480px) { #groupGrid { grid-template-columns: repeat(3, 1fr); } }
  .group-btn {
    background: var(--deepteal); color: var(--cream); border: none; border-radius: 14px;
    padding: 18px 8px; font-size: 16px; font-weight: 700; font-family: Cambria, Georgia, serif;
    cursor: pointer;
  }
  .group-btn:active { transform: scale(0.96); }

  label { display: block; font-size: 13px; margin: 10px 0 4px; color: var(--gold); font-weight: 700; }
  input[type=text], textarea, select {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08); color: var(--cream); font-size: 15px; font-family: inherit;
  }
  .card.light input[type=text], .card.light textarea, .card.light select {
    background: #f4f4f4; color: var(--charcoal); border: 1px solid #ddd;
  }
  textarea { min-height: 70px; resize: vertical; }

  .size-row { display: flex; gap: 8px; margin: 10px 0 16px; }
  .size-btn {
    flex: 1; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.07); color: var(--cream); font-weight: 700; cursor: pointer; font-size: 15px;
  }
  .size-btn.selected { background: var(--gold); color: var(--charcoal); border-color: var(--gold); }

  button.primary {
    background: var(--gold); color: var(--charcoal); border: none; border-radius: 10px;
    padding: 13px 18px; font-size: 16px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 10px;
  }
  button.secondary {
    background: rgba(255,255,255,0.1); color: var(--cream); border: 1px solid rgba(255,255,255,0.25);
    border-radius: 10px; padding: 11px 16px; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 8px;
  }
  button.next-dim {
    background: rgba(255,255,255,0.05); color: var(--dim); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px; padding: 11px 16px; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 8px;
  }
  button.next-ready {
    background: var(--gold); color: var(--charcoal); border: 2px solid var(--gold);
    border-radius: 10px; padding: 13px 16px; font-size: 16px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 8px;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.02); } }

  button.link-btn {
    display: inline-block; background: var(--emerald); color: #fff; text-decoration: none;
    border-radius: 10px; padding: 12px 16px; font-size: 15px; font-weight: 700; text-align: center; width: 100%; margin-top: 8px;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .action-row { display: flex; gap: 8px; margin-top: 8px; }
  .action-row button { flex: 1; margin-top: 0; }

  .timer-box {
    position: sticky; top: 0; z-index: 20; background: var(--emerald); border-radius: 12px;
    padding: 10px 14px; text-align: center; margin-bottom: 14px; border: 2px solid var(--gold);
  }
  .timer-box .t { font-size: 30px; font-weight: 800; color: var(--gold); font-family: Cambria, Georgia, serif; }
  .timer-box.warning { animation: flash 0.6s infinite; }
  .timer-box.frozen { border-color: var(--danger); }
  .timer-box.frozen .t { color: var(--danger); }
  @keyframes flash { 0%,100% { background: var(--emerald); } 50% { background: var(--danger); } }

  .frozen-note { color: var(--danger); font-weight: 700; text-align: center; margin-bottom: 10px; display: none; }
  .frozen-note.show { display: block; }

  .validation-warning { color: var(--danger); font-weight: 700; text-align: center; margin-top: 8px; display: none; }
  .validation-warning.show { display: block; }

  .choice-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .choice-chip {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.25); color: var(--cream);
    border-radius: 20px; padding: 8px 14px; font-size: 13px; cursor: pointer;
  }
  .choice-chip.selected { background: var(--gold); color: var(--charcoal); border-color: var(--gold); }

  .presenter-name, .word-display { font-size: 24px; font-weight: 800; text-align: center; color: var(--gold); margin: 14px 0; font-family: Cambria, Georgia, serif; }
  .score-badge { text-align: center; font-size: 15px; color: var(--cream); margin-bottom: 8px; }

  #groupNamesBtn {
    position: fixed; bottom: 14px; right: 14px; z-index: 30;
    background: var(--gold); color: var(--charcoal); border: none; border-radius: 24px;
    padding: 12px 18px; font-weight: 800; font-size: 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    cursor: pointer; display: none;
  }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 40;
    align-items: center; justify-content: center; padding: 16px;
  }
  .modal-overlay.show { display: flex; }
  .modal-box { background: var(--emerald); border: 2px solid var(--gold); border-radius: 16px; padding: 20px; max-width: 420px; width: 100%; max-height: 80vh; overflow-y: auto; }

  .poem-block { background: rgba(255,255,255,0.06); border-radius: 10px; padding: 14px; font-style: italic; font-size: 14px; line-height: 1.6; margin: 10px 0; }

  .confirm-msg { text-align: center; font-weight: 700; color: var(--gold); margin-top: 8px; display: none; }
  .confirm-msg.show { display: block; }

  .qbtn-row { display: flex; gap: 8px; margin: 10px 0; }
  .qbtn-row button { flex: 1; }

  .mcq-option {
    display: block; width: 100%; text-align: left; background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.2); color: var(--cream); border-radius: 10px;
    padding: 12px; margin-top: 8px; font-size: 15px; cursor: pointer;
  }
  .mcq-option.correct { background: #1f6b3f; border-color: #2e8b57; }
  .mcq-option.incorrect { background: #6b2a24; border-color: var(--danger); }
  .mcq-feedback { margin-top: 10px; font-weight: 700; }
  .mcq-feedback.ok { color: #6fd08c; }
  .mcq-feedback.no { color: #ff8a80; }

  .instructions-block { line-height: 1.6; font-size: 15px; }
  .instructions-block ul { padding-left: 20px; }

  footer.credit { text-align: center; color: #6f8a7f; font-size: 11px; padding: 16px; }
</style>
</head>

  <div class="kicker">Semester Review</div>

<script>
/* ============ CONFIG ============ */
const CLASS_LABEL = "002";
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzaQykqDJOd9pdgSmt2WIbYyRYOGJk_jjn3A5UA-s1X83C7rY_W1lS05BjBqm9f5a4G/exec";
const SHEETS_CONFIGURED = SCRIPT_URL && SCRIPT_URL.indexOf("http") === 0;

const groupNamesList = ["Dora", "Indiana Jones", "Lara Croft", "Moana", "Frodo",
  "Nathan Drake", "Robin Hood", "Sherlock Holmes", "Katniss", "Percy Jackson"];

const FEMINISM_ARTWORKS = [
  "Botticelli - Birth of Venus", "Manet - Olympia", "Klimt - The Kiss",
  "Kahlo - The Broken Column", "Cindy Sherman - Untitled Film Still",
  "Beyonce - Lemonade", "Die Antwoord - Cookie Thumper", "Zanele Muholi - Somnyama Ngonyama"
];

const SAPIR_WORDS = [
  { word: "Saudade", lang: "Portuguese", pron: "sow-DAH-jee",
    truth: "A deep, nostalgic longing for someone or something absent.",

  { word: "Komorebi", lang: "Japanese", pron: "koh-moh-REH-bee",
    truth: "Sunlight filtering through the leaves of trees.",

  { word: "Waldeinsamkeit", lang: "German", pron: "vald-EYN-zahm-kite",
    truth: "The feeling of being pleasantly alone in the woods.",
    lie: "A formal ceremony of forgiveness between neighbours." },
  { word: "Hiraeth", lang: "Welsh", pron: "HEER-eye-th",
    truth: "A deep longing for a home or homeland, tinged with grief.",

  { word: "Hygge", lang: "Danish", pron: "HOO-gah",
    truth: "Cosy contentment from enjoying simple things with people you like.",
    lie: "An open faced sandwich eaten only in winter." },
  { word: "Iktsuarpok", lang: "Inuktitut", pron: "eek-SOO-ar-pok",
    truth: "The anticipation that makes you keep checking if someone is coming.",
    lie: "The practice of building a small ice shelter for one night." },

const BAD_POEM = `I remember when I walked into this class,
I did not want to learn, I just needed to pass.
Then Pollock splattered paint upon my brain,
And now abstract expression I explain.

But documentation is something we all must do.`;

const POSTER_COUNT = 8;
const MIN_POSTERS = 4;
const POSTER_QUESTIONS = [
  "What was their incubation stage like?",
  "What was their illumination stage like?",
  "What was their preparation stage like?",
  "What was their verification stage like?",
  "Where was the person when they went through this process?",
  "How long was their creative process?",
  "Did they have support with their creative process?",
  "Was their art immediately popular?",
];

var STATIONS = [
  { id: "gallery", name: "Creative Process: Posters", minutes: 10,
    overview: "Look at the posters around the room. Complete at least 4, short notes are fine. All 8 are there if you have time and want to do more.",
    mcqs: [
      { q: "How many posters do you need to complete at minimum?", options: ["2", "4", "8", "10"], correct: 1 },
      { q: "What do you record first for each poster?", options: ["Colour and size", "Artwork name and artist", "Price and location", "Teacher's opinion"], correct: 1 },
      { q: "Does every poster ask the exact same specific question?", options: ["Yes, always the same", "No, it changes per poster", "Only for poster 1", "There are no specific questions"], correct: 1 },
    ] },
  { id: "sapir", name: "Sapir-Whorf: Call My Bluff", minutes: 8,
    overview: "You'll play Call My Bluff with 6 untranslatable words. For each word, two students are picked as presenters, Team A. Pass the phone to them and press the button once Team B, the rest of the group, cannot see the screen. The app will tell each presenter exactly which meaning to say, true or false, make the false one sound convincing. Team B must ask 3 questions, clicking a button each time a question is asked, before guessing who told the truth. After the guess, the phone passes to a new pair for the next word.",
    mcqs: [
      { q: "How many questions must Team B ask before guessing?", options: ["1", "2", "3", "5"], correct: 2 },
      { q: "Who decides which presenter says the true meaning?", options: ["The presenters choose", "The app decides randomly", "Team B decides", "It's always the first presenter"], correct: 1 },
      { q: "What should the presenter with the false meaning do?", options: ["Skip it", "Say it half-heartedly", "Make it convincing using imagination", "Tell the group it's false"], correct: 2 },
    ] },
  { id: "feminism", name: "Feminism and Art Presentations", minutes: 7,
    overview: "You'll present your assigned artwork from the feminism board. The app picks a random presenting order, one member at a time, tap Next Presenter to reveal who's up. If two of you share an artwork, split it: one covers symbolism, the other covers technique or context. After everyone presents, vote together on 4 polls, then write a sentence justifying one choice.",
    mcqs: [
      { q: "If two of you have the same artwork, what should you do?", options: ["Present the same thing twice", "Split it into different aspects", "Skip one person's turn", "Choose a new artwork"], correct: 1 },
      { q: "How is the presenting order decided?", options: ["Alphabetical", "Randomly by the app", "The teacher decides", "Tallest first"], correct: 1 },
    ] },
  { id: "fashion", name: "Fashion Sway + Gemini Remix", minutes: 7,
    overview: "Share your chosen fashion piece with your group. Open Gemini in a new tab and design one combined look using everyone's picks, then come back to this tab. Describe the look in your own words, then paste the link to the Gemini image.",
    mcqs: [
      { q: "What tool do you use to combine the looks?", options: ["Suno", "Gemini", "Magic School", "Canvas"], correct: 1 },
      { q: "What do you paste in at the end?", options: ["A photo file", "A link to your Gemini image", "Your phone number", "Nothing"], correct: 1 },
    ] },
  { id: "nosedive", name: "Nosedive: Truth or Dare", minutes: 6,
    overview: "Open the Magic School link in a new tab and join the truth or dare game based on Nosedive. Play a few rounds as a group, then come back to this tab and write a one-line reflection on whether our world is close to Nosedive.",
    mcqs: [
      { q: "What show is this game based on?", options: ["Black Mirror: Nosedive", "Friends", "The Office", "Stranger Things"], correct: 0 },
      { q: "What do you write at the end?", options: ["A drawing", "A one-line reflection", "A song", "Nothing"], correct: 1 },
    ] },
  { id: "suno", name: "Suno Song Showcase", minutes: 8,
    overview: "You may leave the classroom to listen to each other's songs, but do not go far, and keep an eye on the timer. Decide whose song was your favourite and why. Then you'll see a badly written verse. Rewrite it fully in your own improved version. Finally, choose style tags and copy your lyrics and tags to paste into Suno in a new tab.",
    mcqs: [
      { q: "Can you leave the classroom for this task?", options: ["No, stay in your seat", "Yes, but stay close and watch the timer", "Yes, for the whole lesson", "Only the teacher can leave"], correct: 1 },
      { q: "What do you do with the badly written verse?", options: ["Ignore it", "Rewrite it fully in your own words", "Copy it exactly", "Delete it"], correct: 1 },
      { q: "What do you do after choosing your style tags?", options: ["Nothing", "Copy lyrics and tags, then paste into Suno", "Submit only the tags", "Email the teacher"], correct: 1 },
    ] },
  { id: "debate", name: "Is Fashion Art? Mini Debate", minutes: 10,
    overview: "Split for and against inside your group. Each side gives a 60 second opening statement, with time between speakers to respond. Spend the last minute writing a short summary of who won and why.",
    mcqs: [
      { q: "How long is each opening statement?", options: ["10 seconds", "60 seconds", "5 minutes", "No limit"], correct: 1 },
      { q: "What do you write after the debate?", options: ["Nothing", "A summary of who won and why", "A new debate topic", "A drawing"], correct: 1 },
    ] },
];

/* ============ STATE ============ */
var currentGroup = null;
var state = null;
var STATIONS_REF = STATIONS; // exposed for tests
let timerHandle = null;
let timerDeadline = 0;
let timerSeconds = 0;
let frozen = false;
let currentCollectFn = () => ({});
let currentBackFn = null;

function memberCount() { return (state && state.members) ? state.members.length : 4; }

function storageKey(g) { return `th_${CLASS_LABEL}_${g}`; }

function loadState(g) {
  const raw = localStorage.getItem(storageKey(g));
  if (raw) return JSON.parse(raw);
  return {
    members: [],
    namesSubmitted: false,
    taskOrder: orderFor(g),
    taskIndex: 0,
    data: {},
  };
}
function saveState() {
  localStorage.setItem(storageKey(currentGroup), JSON.stringify(state));
  syncStateToServer();
}

function seedFromName(name) { return [...name].reduce((a, c) => a + c.charCodeAt(0), 0); }
function orderFor(groupName) {
  const seed = seedFromName(groupName);
  return STATIONS.map((s, i) => ({ id: s.id, k: (seed * (i + 7) + i * 13) % 97 }))
    .sort((a, b) => a.k - b.k).map(x => x.id);
}

/* ============ AUDIO (unlocked on first user gesture) ============ */
let audioCtx = null;
function unlockAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    else if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) {}
}
function beep(freq, dur) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.value = freq || 880;
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    osc.start(); osc.stop(audioCtx.currentTime + (dur || 0.25));
  } catch (e) {}
}

/* ============ WAKE LOCK (keep screen on) ============ */
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
  } catch (e) {}
}
if (typeof document !== "undefined") {
  document.addEventListener("visibilitychange", async () => {
    if (wakeLock !== null && document.visibilityState === "visible") await requestWakeLock();
  });
}

/* ============ SERVER SYNC (Google Sheet via Apps Script) ============ */
function syncStateToServer() {
  if (!SHEETS_CONFIGURED || !currentGroup) return;
  fetch(SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({
      type: "state", class: CLASS_LABEL, group: currentGroup,
      members: state.members, taskIndex: state.taskIndex, timestamp: new Date().toISOString(),
    }),
  }).catch(() => {});
}

async function fetchStateFromServer(group) {
  if (!SHEETS_CONFIGURED) return null;
  try {
    const res = await fetch(`${SCRIPT_URL}?action=state&class=${encodeURIComponent(CLASS_LABEL)}&group=${encodeURIComponent(group)}`);
    if (!res.ok) return null;
    const data = await res.json();
    return data && data.found ? data : null;
  } catch (e) { return null; }
}

async function sendToSheet(stationId, payload) {
  const record = {
    type: "submission", class: CLASS_LABEL, group: currentGroup, station: stationId,
    members: state.members, timestamp: new Date().toISOString(), data: payload
  };
  let sent = false;
  if (SHEETS_CONFIGURED) {
    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(record)
      });
      sent = true;
    } catch (e) { sent = false; }
  }
  localStorage.setItem(`submission_${CLASS_LABEL}_${currentGroup}_${stationId}`, JSON.stringify(record));
  return { sent, record };
}

/* ============ APP SHELL ============ */
const app = document.getElementById("app");

function setFooterText() {
  const f = document.getElementById("footerCredit");
  if (!f) return;
  f.textContent = SHEETS_CONFIGURED
    ? "Submissions save on this phone and send to your teacher's sheet automatically."
    : "Submissions save on this phone only right now. Ask your teacher if the sheet is connected yet.";
}
setFooterText();

function renderGroupGrid() {
  document.getElementById("groupNamesBtn").style.display = "none";
  app.innerHTML = `
    <div class="card">
      <p style="margin:0 0 4px;font-size:15px;">Tap your group's name.</p>
      <div id="groupGrid"></div>
    </div>`;
  const grid = document.getElementById("groupGrid");
  groupNamesList.forEach(g => {
    const btn = document.createElement("button");
    btn.className = "group-btn";
    btn.textContent = g;
    btn.onclick = () => selectGroup(g);
    grid.appendChild(btn);
  });
}

async function selectGroup(g) {
  clearTimerUI(); // cancel any previous group's abandoned timer so it can't freeze this group's screen later
  unlockAudio();
  requestWakeLock();
  currentGroup = g;
  state = loadState(g);

  // if a Sheet is connected, prefer server-side progress (covers switching phones mid-task)
  const server = await fetchStateFromServer(g);
  if (server && server.taskIndex != null && Array.isArray(server.members) && server.members.length > 0) {
    state.members = server.members;
    state.namesSubmitted = true;
    state.taskIndex = Math.max(state.taskIndex || 0, server.taskIndex);
  }
  saveState();
  document.getElementById("groupNamesBtn").style.display = "block";
  if (!state.namesSubmitted) renderNameEntry();
  else renderTaskOverview();
}

function renderNameEntry() {
  const chosenSize = state.members.length || 4;
  app.innerHTML = `
    <div class="card">
      <h2 class="screen-title">${currentGroup}: Who's Here?</h2>
      <p class="muted">How many in your group?</p>
      <div class="size-row" id="sizeRow"></div>
      <div id="nameFields"></div>
      <button class="primary" onclick="submitNames()">Submit Names</button>
    </div>`;
  const sizeRow = document.getElementById("sizeRow");
  [4, 5, 6].forEach(n => {
    const btn = document.createElement("button");
    btn.className = "size-btn" + (n === chosenSize ? " selected" : "");
    btn.textContent = n + " students";
    btn.onclick = () => { setGroupSize(n); };
    sizeRow.appendChild(btn);
  });
  buildNameFields(chosenSize);
}

function setGroupSize(n) {
  document.querySelectorAll(".size-btn").forEach(b => b.classList.toggle("selected", b.textContent.startsWith(String(n))));
  buildNameFields(n);
}

function buildNameFields(n) {
  const wrap = document.getElementById("nameFields");
  const existing = state.members || [];
  wrap.innerHTML = "";
  for (let i = 0; i < n; i++) {
    const div = document.createElement("div");
    div.innerHTML = `<label>Member ${i + 1}</label>
      <input type="text" id="nameInput${i}" value="${existing[i] || ""}" placeholder="Name">`;
    wrap.appendChild(div);
  }
  wrap.dataset.count = n;
}

function submitNames() {
  const n = parseInt(document.getElementById("nameFields").dataset.count, 10) || 4;
  const names = [];

/* ============ TIMER ENGINE (deadline-based, survives backgrounded tabs) ============ */
function clearTimerUI() {
  if (timerHandle) clearInterval(timerHandle);
  timerHandle = null; frozen = false;
}

function startTimer(minutes) {
  timerDeadline = Date.now() + minutes * 60000;
  frozen = false;
  tick();
  timerHandle = setInterval(tick, 1000);
}

function tick() {
  const prevSeconds = timerSeconds;
  timerSeconds = Math.round((timerDeadline - Date.now()) / 1000);
  renderTimerBar();
  if ([20, 15, 10, 5, 4, 3, 2, 1].includes(timerSeconds) && timerSeconds !== prevSeconds) {
    beep(timerSeconds <= 5 ? 1046 : 880, 0.2);
  }
  if (timerSeconds <= 0 && !frozen) {
    clearInterval(timerHandle);
    frozen = true;
    beep(440, 0.6);
    const bar = document.getElementById("timerBar");
    if (bar) { bar.classList.add("frozen"); bar.classList.remove("warning"); }
    // soft freeze: only disable flow/navigation buttons, NOT text inputs,
    // so students can finish a sentence they're mid-typing before submitting
    document.querySelectorAll(".freeze-target").forEach(el => el.disabled = true);
    const note = document.getElementById("frozenNote");
    if (note) note.classList.add("show");
  }
}

function renderTimerBar() {
  const bar = document.getElementById("timerBar");
  if (!bar) return;
  const s = Math.max(timerSeconds, 0);
  const m = Math.floor(s / 60);
  bar.querySelector(".t").textContent = `${m}:${(s % 60).toString().padStart(2, "0")}`;
  bar.classList.toggle("warning", timerSeconds <= 20 && timerSeconds > 0);
}

function timerBarHtml() {
  return `<div class="timer-box" id="timerBar"><div class="t">--:--</div></div>
    <p class="frozen-note" id="frozenNote">Time's up. You can still type, then submit, skip, or go back.</p>`;
}

/* ---- generic emptiness check so blank submissions can be blocked ---- */
function isPayloadEmpty(val) {
  if (val === null || val === undefined) return true;
  if (typeof val === "string") return val.trim() === "";
  if (Array.isArray(val)) return val.length === 0 || val.every(isPayloadEmpty);
  if (typeof val === "object") return Object.values(val).every(isPayloadEmpty);
  return false; // numbers/booleans (e.g. a score) count as real content
}

async function doSubmit(stationId, btn) {
  const payload = currentCollectFn();
  const warning = document.getElementById("validationWarning");
  if (!frozen && isPayloadEmpty(payload)) {
    if (warning) warning.classList.add("show");
    return;
  }
  if (warning) warning.classList.remove("show");
  if (btn) { btn.disabled = true; btn.textContent = "Submitting..."; }
  const result = await sendToSheet(stationId, payload);
  if (btn) { btn.textContent = result.sent ? "Submitted!" : "Saved (offline copy kept)"; }
  const msg = document.getElementById("confirmMsg");
  if (msg) msg.classList.add("show");
  const nextBtn = document.getElementById("nextBtn");
  if (nextBtn) { nextBtn.classList.remove("next-dim"); nextBtn.classList.add("next-ready"); }
}

    chip.textContent = opt;
    chip.onclick = () => {
      if (multi) {
        if (sunoTags[key].has(opt)) { sunoTags[key].delete(opt); chip.classList.remove("selected"); }
        else { sunoTags[key].add(opt); chip.classList.add("selected"); }
      } else {
        sunoTags[key] = opt;
        [...row.children].forEach(c => c.classList.remove("selected"));
        chip.classList.add("selected");
      }
    };
    row.appendChild(chip);
  });
}

function copySunoText() {
  const lyrics = document.getElementById("s_rewrite").value;
  const tags = `Instruments: ${[...sunoTags.instrument].join(", ") || "any"}. Emotion: ${sunoTags.emotion || "any"}. Genre: ${sunoTags.genre || "any"}. Voice: ${sunoTags.voice || "any"}.`;
  const text = lyrics + "\n\n[Style] " + tags;
  if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
  document.getElementById("sunoCopyMsg").classList.add("show");
}

function collectSuno() {
  return {
    favourite: document.getElementById("s_fav").value,
    favouriteWhy: document.getElementById("s_favwhy").value,
    rewrite: document.getElementById("s_rewrite").value,
    styleTags: {
      instrument: [...sunoTags.instrument], emotion: sunoTags.emotion,
      genre: sunoTags.genre, voice: sunoTags.voice
    },
  };
}

/* ============ STATION: DEBATE ============ */
function renderDebate(st) {
  currentCollectFn = collectDebate;
  currentBackFn = null;
  const content = document.getElementById("stationContent");
  content.innerHTML = `
    <div class="card light">
      <h2 class="screen-title">${st.name}</h2>
      <p>Split for and against inside your group. Give 60 second opening statements each side, with time to respond between speakers.</p>
      <button class="secondary freeze-target" id="startDebateBtn" onclick="beginDebate()">Click to Start Debating</button>
      <div id="debateWrap" style="display:none;">
        <label>Summary: who won, and why?</label>
        <textarea id="d_summary"></textarea>
      </div>
    </div>`;
}
function beginDebate() {
  document.getElementById("startDebateBtn").disabled = true;
  document.getElementById("debateWrap").style.display = "block";
}
function collectDebate() {
  const el = document.getElementById("d_summary");
  return { summary: el ? el.value : null };
}

/* ============ BOOT ============ */
renderGroupGrid();
</script>
